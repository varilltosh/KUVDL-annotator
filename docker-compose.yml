services:
  wbc:
    build: .
    ports:
      - "5080:5080"
    volumes:
      - /home/skuba/skuba_ws/src/try_vision_project:/vision
      # code mounted so `git pull` + restart picks up changes without a rebuild
      - ./app.py:/app/app.py
      - ./static:/app/static
      - ./uploads:/app/uploads
      - ./labels:/app/labels
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
